name: Flutter CI

on:
  pull_request:
    branches:
      - dev
      - prod
      - main
  push:
    branches:
      - dev
      - prod
      - main

jobs:
  flutter-analyze:
    name: flutter-analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

  flutter-format:
    name: flutter-format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .

  promotion-guard:
    name: promotion-guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Validate branch promotion path
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          case "$BASE_BRANCH" in
            dev)
              exit 0
              ;;
            prod)
              if [ "$HEAD_BRANCH" = "dev" ]; then
                exit 0
              fi
              echo "Only dev can be merged into prod."
              exit 1
              ;;
            main)
              if [ "$HEAD_BRANCH" = "prod" ]; then
                exit 0
              fi
              echo "Only prod can be merged into main."
              exit 1
              ;;
            *)
              echo "Unsupported protected base branch: $BASE_BRANCH"
              exit 1
              ;;
          esac
